name: openshell-container-image
base: ubuntu@24.04
adopt-info: openshell-sandbox
version: git
summary: OpenShell container image for LXD sandboxes
description: |
  Ubuntu Noble container image for OpenShell sandboxes, including the
  openshell-sandbox supervisor and a container-adapted init wrapper.
  Produced as an OCI rock and converted to a native LXD image by CI.

platforms:
  amd64:
  arm64:

parts:
  users:
    plugin: nil
    override-overlay: |
      groupadd --gid 10001 sandbox
      # HOME must be /sandbox. The supervisor's Landlock baseline permits
      # /sandbox and /tmp read-write but nothing under /home, so a home
      # directory elsewhere makes every shell fail to read its own dotfiles
      # ("Permission denied" on .profile/.bashrc). Matches upstream's
      # convention in openshell-vm-sandbox-init.sh. /sandbox itself is
      # created and chowned at boot by openshell-container-init.sh, so
      # --no-create-home is correct here.
      useradd --uid 10001 --gid 10001 --home-dir /sandbox --no-create-home \
          --shell /bin/sh sandbox

  openshell-sandbox:
    plugin: rust
    source: https://github.com/NVIDIA/OpenShell.git
    source-commit: d556748771c41cbbd4e4dd7cd9030c798afe2b7d # v0.0.86
    source-subdir: crates/openshell-sandbox
    build-packages:
      - pkg-config
      - libssl-dev
      - protobuf-compiler
      - libprotobuf-dev
      - libclang-dev
      - cmake
      - build-essential
      - clang
      - libz3-dev
    stage-packages:
      - ca-certificates
      - curl
      - iproute2
      - dhcpcd
      - nftables
      - python3
      - sqlite3
    override-pull: |
      craftctl default
      craftctl set version=v0.0.86
    organize:
      bin/openshell-sandbox: opt/openshell/bin/openshell-sandbox

  scripts:
    plugin: nil
    source: scripts
    override-build: |
      install -D -m 0755 openshell-container-init.sh \
        "$CRAFT_PART_INSTALL/opt/openshell/bin/openshell-container-init.sh"

  token-placeholder:
    plugin: nil
    override-build: |
      # Create the mount point for the per-sandbox JWT token file. The
      # driver pushes the real token into this path via the LXD files API
      # (POST /1.0/instances/<name>/files, see push_file_into_instance in
      # lxd-client) before starting the instance; LXD's file-push API needs
      # the destination path to already exist. The empty placeholder here is
      # overwritten by the real token at container-create time and is never
      # read directly.
      install -D -m 0600 /dev/null \
        "$CRAFT_PART_INSTALL/etc/openshell/auth/sandbox.jwt"
