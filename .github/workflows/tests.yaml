name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lxd-client-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: canonical/setup-lxd@da2ac84e727dc534215fd14cd088b9209d65893b
      - name: Install rustup
        run: sudo snap install --classic rustup
      - name: Install Rust toolchain
        run: rustup toolchain install stable --component rustfmt,clippy
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev
      - name: Run lxd-client tests
        run: make test-lxd-client

  container-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: canonical/setup-lxd@da2ac84e727dc534215fd14cd088b9209d65893b
      - name: Install rockcraft and umoci
        run: |
          sudo snap install rockcraft --classic
          sudo apt-get update && sudo apt-get install -y umoci
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: stable
      - name: Install lxd-convert
        run: |
          go install github.com/canonical/lxd/lxd-convert@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build sandbox image
        run: make sandbox-image
      - name: Export image
        run: lxc image export openshell-sandbox openshell-sandbox
      - name: Upload image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-image
          path: openshell-sandbox.tar

  driver-tests:
    needs: container-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: canonical/setup-lxd@da2ac84e727dc534215fd14cd088b9209d65893b
      - name: Install rustup
        run: sudo snap install --classic rustup
      - name: Install Rust toolchain
        run: rustup toolchain install stable --component rustfmt,clippy
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev
      - name: Download image artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: container-image
      - name: Import sandbox image
        run: lxc image import openshell-sandbox.tar --alias openshell-sandbox
      - name: Run driver tests
        run: make test-driver
