[workspace]
resolver = "2"
members = ["crates/computev1", "crates/lxd-client", "crates/openshell-driver-lxd"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/canonical/openshell-driver-lxd"
authors = ["openshell-driver-lxd contributors"]
rust-version = "1.81"

[workspace.dependencies]
# gRPC + protobuf
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
futures = "0.3"

# CLI
clap = { version = "4", features = ["derive"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Errors
thiserror = "2"

# HTTP transport (lxd-client)
hyper = { version = "1.10.1", features = ["client", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
http-body-util = "0.1"

# Serialization (lxd-client)
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

# TLS (lxd-client HTTPS transport)
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "tls12"] }
tokio-rustls = "0.26"
rustls-pemfile = "2"
webpki-roots = "0.26"

# WebSocket (lxd-client event stream)
tokio-tungstenite = "0.26"
