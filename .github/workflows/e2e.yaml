name: E2E tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-lxd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: NVIDIA/OpenShell
          path: ../OpenShell
      - uses: canonical/setup-lxd@da2ac84e727dc534215fd14cd088b9209d65893b
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            ../OpenShell
      - name: Install build dependencies
        run: |
          sudo snap install rockcraft --classic
          sudo apt-get install -y umoci
          go install github.com/canonical/lxd/lxd-convert@lxd-6.8
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build sandbox image
        run: make sandbox-image
      - name: Run e2e tests
        env:
          OPENSHELL_REPO: ${{ github.workspace }}/../OpenShell
        run: make e2e
